<div id="boot"><div class="emblem"><span>⬡</span></div><h1>AMPYDESK</h1><div class="subtitle">A M P Y B I O S &nbsp; / &nbsp; G P T</div><div id="bootlog"></div><div id="bootprog"><div></div></div></div><div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const token=new URLSearchParams(location.search).get("t")||"";
const api=(path)=>path+(path.includes("?")?"&":"?")+"t="+encodeURIComponent(token);
const requests=async(path,opts={})=>{const r=await fetch(api(path),{cache:"no-store",...opts});if(!r.ok)throw new Error((await r.text()).slice(0,160));return r};
const json=async(path,opts)=>await(await requests(path,opts)).json();
const post=async(path)=>json(path,{method:"POST"});
const bootlog=(line)=>{const e=document.createElement("div");e.textContent="> "+line;$("#bootlog").append(e);$("#bootlog").scrollTop=9999};
const progress=n=>$("#bootprog div").style.width=n+"%";
let state={},windowCount=0,topZ=8,front="",timer=null,screenURL=null,remap=null;
const profiles={};
const defaultMap={KeyW:[.18,.74],KeyA:[.1,.83],KeyS:[.18,.91],KeyD:[.26,.83],Space:[.86,.8],Enter:[.87,.91]};
let keymap=JSON.parse(localStorage.getItem("ampy.keys")||"null")||defaultMap;
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>el.classList.remove("show"),3800)}
function mk(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function action(text,click){let b=mk("button","action",text);b.addEventListener("click",click);return b}
function append(parent,...children){for(const child of children)parent.append(child);return parent}
function bootFinish(){progress(100);setTimeout(()=>{$("#boot").style.opacity=0;$("#boot").style.visibility="hidden";$("#boot").style.pointerEvents="none"},330)}
async function startBoot() {
  bootlog("AMPY CORE • browser client loaded");progress(10);
  try {
    bootlog("AUTH + LAN SERVICE • requesting handshake");
    state=await json("/api/status");progress(35);
    bootlog("ANDROID DEVICE • "+state.name+" / "+state.android);
    bootlog("DEVICE OWNER • "+(state.owner?"ACTIVE":"NOT PROVISIONED"));
    bootlog("ACCESSIBILITY • "+(state.accessibility?"CONNECTED":"OPTIONAL / DISABLED"));
    await json("/api/apps");progress(62);bootlog("ANDROID APP CATALOG • READY");
    await json("/api/files");progress(84);bootlog("TRANSFER VAULT • MOUNTED");
    bootlog("DESKTOP COMPOSITOR • READY");
    $("#linkstatus").textContent="CONNECTED";
    $("#statline").textContent=state.name+" / LAN";
    fillHud();
  }catch(e){bootlog("SERVICE ERROR • "+e.message);$("#linkstatus").textContent="OFFLINE";toast("Connessione non disponibile")}
  bootFinish();
}
function icon(label,glyph,id){const b=mk("button","tile");append(b,mk("span","glyph",glyph),mk("span","",label));b.onclick=()=>openWindow(id);$("#icons").append(b)}
[["Android","▣","apps"],["File Transfer","⇄","files"],["Remote Phone","◈","remote"],["Keymapper","⌨","keymap"],["Customization","⚙","settings"],["System","◎","system"],["AmpyPad","✎","pad"],["AmpyLab","✧","lab"]].forEach(x=>icon(...x));
function openWindow(kind) {
  const existing=document.getElementById("w-"+kind);
  if(existing){existing.style.display="flex";focus(existing);return}
  const names={apps:"ANDROID APP DRAWER",files:"AMPY FILE TRANSFER",remote:"PIXEL REMOTE CONTROL",keymap:"GAME / APP KEYMAPPER",settings:"AMPY CUSTOMIZATION",system:"SYSTEM STATUS",pad:"AMPYPAD / NOTE LAB",lab:"AMPYLAB / EFFECTS"};
  let w=mk("div","window");w.id="w-"+kind;w.style.left=(15+(windowCount%5)*5)+"%";w.style.top=(12+(windowCount%5)*3)+"%";windowCount++;
  let head=mk("div","titlebar");
  append(head,mk("span","mark","⬡"),mk("strong","",names[kind]||kind));
  let controls=mk("div","winbuttons");let min=mk("button","","━"),max=mk("button","","▢"),close=mk("button","","×");
  min.title="Minimize";max.title="Maximize / Restore";close.title="Close";
  controls.append(min,max,close);head.append(controls);
  let content=mk("div","content");w.append(head,content);$("#desk").append(w);
  let task=mk("button","",names[kind]);task.id="task-"+kind;$("#taskApps").append(task);
  task.onclick=()=>w.style.display==="none"?(w.style.display="flex",focus(w)):(w.style.display="none");
  close.onclick=()=>{w.remove();task.remove();if(front===kind)front=""};
  min.onclick=()=>w.style.display="none";
  max.onclick=()=>{let full=w.dataset.max==="1";w.dataset.max=full?"0":"1";w.style.left=full?"19%":"1%";w.style.top=full?"14%":"50px";w.style.width=full?"700px":"98%";w.style.height=full?"510px":"calc(100% - 60px)";w.style.resize=full?"both":"none"};
  w.addEventListener("pointerdown",()=>focus(w));
  let drag=null;
  head.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;focus(w);head.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop,vx:0,vy:0};w.classList.add("dragging");e.preventDefault()});
  head.addEventListener("pointermove",e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.vx=dx;drag.vy=dy;w.style.left=Math.max(0,Math.min(innerWidth-90,drag.l+dx))+"px";w.style.top=Math.max(48,Math.min(innerHeight-110,drag.t+dy))+"px";w.style.transform="skew("+Math.max(-5,Math.min(5,dx*.012))+"deg,"+Math.max(-3,Math.min(3,dy*.014))+"deg) rotate("+Math.max(-3,Math.min(3,dx*.007))+"deg)"});
  function release(){if(!drag)return;drag=null;w.classList.remove("dragging");w.style.transition="transform .65s cubic-bezier(.13,1.8,.4,1), box-shadow .2s";w.style.transform="";setTimeout(()=>w.style.transition="",680)}
  head.addEventListener("pointerup",release);head.addEventListener("pointercancel",release);
  focus(w);
  if(kind==="apps")renderApps(content);
  if(kind==="files")renderFiles(content);
  if(kind==="remote")renderRemote(content);
  if(kind==="keymap")renderKeys(content);
  if(kind==="settings")renderSettings(content);
  if(kind==="system")renderSystem(content);
  if(kind==="pad")renderNotes(content);
  if(kind==="lab")renderLab(content);
}
function focus(w){topZ++;w.style.zIndex=topZ;front=w.id.slice(2)}
async function renderApps(c) {
  append(c,mk("h2","","Installed Android applications"),mk("p","subtle","Il comando richiede l'apertura autorizzata di app Android. Android può bloccare gli avvii in background."));
  let search=mk("input");search.placeholder="Search applications...";c.append(search);
  let grid=mk("div","grid");grid.style.marginTop="14px";c.append(grid);
  let apps=[];
  try{apps=await json("/api/apps");apps.sort((a,b)=>a.name.localeCompare(b.name));}catch(e){toast(e.message)}
  const draw=()=>{grid.replaceChildren();for(const app of apps.filter(a=>a.name.toLowerCase().includes(search.value.toLowerCase()))){
    const b=mk("button","item");append(b,mk("span","","▣"),mk("span","name",app.name));b.onclick=async()=>{try{await post("/api/launch?package="+encodeURIComponent(app.package));toast("Avvio richiesto: "+app.name)}catch(e){toast("Avvio bloccato: "+app.name)}};grid.append(b)
  }};search.oninput=draw;draw();
}
async function renderFiles(c) {
  append(c,mk("h2","","PC ⇄ Pixel Transfer"),mk("p","subtle","Caricamento e download da una cartella isolata AmpyDeskGPT sul telefono. Max 100 MB per file; rete locale fidata."));
  let row=mk("div","row");let chooser=mk("input");chooser.type="file";chooser.multiple=true;chooser.style.flex="1";let upload=action("⬆ Upload",()=>sendFiles(chooser.files));
  let refresh=action("⟳ Refresh",list);append(row,chooser,upload,refresh);c.append(row);
  let progress=mk("p","subtle","");c.append(progress);
  let drop=mk("div","item","Drop files here from Windows Explorer");drop.style.justifyContent="center";drop.style.height="70px";drop.style.borderStyle="dashed";drop.style.margin="12px 0";c.append(drop);
  drop.ondragover=e=>{e.preventDefault();drop.style.borderColor="var(--gold)"};
  drop.ondragleave=()=>drop.style.borderColor="";
  drop.ondrop=e=>{e.preventDefault();drop.style.borderColor="";sendFiles(e.dataTransfer.files)};
  let listBox=mk("div","stack");c.append(listBox);
  async function list(){listBox.replaceChildren();try{let files=await json("/api/files");if(!files.length)listBox.append(mk("p","subtle","The transfer folder is empty."));for(const file of files){
    let item=mk("div","item"),name=mk("span","name",file.name),sz=mk("span","subtle",(file.size/1024).toFixed(1)+" KB");
    let download=action("⬇ Download",()=>{let a=document.createElement("a");a.href=api("/api/download?name="+encodeURIComponent(file.name));a.download=file.name;document.body.append(a);a.click();a.remove()});
    append(item,mk("span","","▤"),name,sz,download);listBox.append(item);
  }}catch(e){toast(e.message)}}
  async function sendFiles(files){for(const file of files){if(file.size>100*1024*1024){toast("100 MB limit: "+file.name);continue}progress.textContent="Transferring "+file.name+"...";
    try {await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open("POST",api("/api/upload?name="+encodeURIComponent(file.name)));xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.textContent=file.name+": "+Math.round(e.loaded/e.total*100)+"%"};xhr.onload=()=>xhr.status===200?resolve():reject(new Error(xhr.responseText));xhr.onerror=()=>reject(new Error("Network"));xhr.send(file)});toast(file.name+" transferred")}catch(e){toast("Transfer error "+e.message)}
  }chooser.value="";progress.textContent="Transfer operation completed";await list()}
  await list();
}
function renderRemote(c) {
  append(c,mk("h2","","Pixel 7 Pro // Android display"),mk("p","subtle","Screenshot tramite Accessibilità (campionamento, non video a 60 FPS). Display acceso e telefono sbloccato. Il desktop virtuale resta indipendente."));
  let row=mk("div","row");for(const [label,name] of [["⌂ Home","home"],["↶ Back","back"],["▤ Recent","recents"],["⏷ Notifications","notifications"]]){
    row.append(action(label,async()=>{try{await post("/api/action?name="+name)}catch(e){toast("Android unavailable")}}))
  }c.append(row);
  let s=mk("div","screen");s.style.marginTop="12px";
  let img=mk("img");img.alt="Android screen";let help=mk("span","overlaylabel","Tap a point to control Android");s.append(img,help);c.append(s);
  let status=mk("p","subtle","Starting remote view...");c.append(status);
  img.addEventListener("click",async e=>{
    const box=img.getBoundingClientRect();let x=(e.clientX-box.left)/box.width,y=(e.clientY-box.top)/box.height;
    if(remap){keymap[remap]=[+x.toFixed(4),+y.toFixed(4)];localStorage.setItem("ampy.keys",JSON.stringify(keymap));toast("Mapped "+remap);remap=null;return}
    try{await post("/api/tap?x="+x+"&y="+y)}catch(e){toast("Tap not sent: unlock phone / enable accessibility")}
  });
  let alive=true;
  const poll=async()=>{
    if(!document.contains(s))return;
    if(document.hidden){setTimeout(poll,1400);return}
    try{const r=await requests("/api/screen");let blob=await r.blob();let url=URL.createObjectURL(blob);
      img.onload=()=>{if(screenURL)URL.revokeObjectURL(screenURL);screenURL=url};
      img.src=url;status.textContent="LIVE SNAPSHOT • click on image or use mapped keys";
    }catch(e){status.textContent="Screen unavailable. Enable accessibility and unlock the Pixel."}
    setTimeout(poll,950);
  };poll();
}
function renderKeys(c) {
  append(c,mk("h2","","Keyboard to Android touch"),mk("p","subtle","Select a key to remap, then click a position in Remote Phone. Keyboard presses produce short touches, NOT sustained gamepad input. Some games reject accessibility input."));
  c.append(action("Open remote screen",()=>openWindow("remote")));
  c.append(mk("div","sectionhead","AMPYDECK CONTROL PROFILES"));
  const prof=mk("div","row");
  const keysByProfile={
    "FPS":{KeyW:[.16,.72],KeyA:[.08,.83],KeyS:[.16,.91],KeyD:[.24,.83],Space:[.88,.86],ShiftLeft:[.76,.82],KeyR:[.87,.54]},
    "Platformer":{ArrowLeft:[.12,.85],ArrowRight:[.27,.85],Space:[.89,.82],KeyZ:[.79,.78],KeyX:[.93,.68]},
    "Media":{Space:[.50,.51],ArrowLeft:[.15,.5],ArrowRight:[.85,.5],ArrowUp:[.5,.25],ArrowDown:[.5,.78]},
    "Reset":defaultMap
  };
  Object.entries(keysByProfile).forEach(([name,map])=>prof.append(action(name,()=>{keymap=JSON.parse(JSON.stringify(map));localStorage.setItem("ampy.keys",JSON.stringify(keymap));paint();toast("Keymap "+name+" loaded")})));
  c.append(prof);
  let grid=mk("div","grid");grid.style.marginTop="14px";c.append(grid);
  function paint(){grid.replaceChildren();for(const [key,point] of Object.entries(keymap)){
    let b=mk("button","item",key+"  →  "+Math.round(point[0]*100)+"% / "+Math.round(point[1]*100)+"%");
    b.onclick=()=>{remap=key;toast("Now click a target in Remote Phone: "+key);openWindow("remote")};grid.append(b)
  }}paint();
  let row=mk("div","row");let keyIn=mk("input");keyIn.placeholder="Browser key code, e.g. KeyQ";let add=action("+ Add key",()=>{if(!/^[a-zA-Z0-9]{2,20}$/.test(keyIn.value))return toast("Use KeyQ / Digit1 / Space");keymap[keyIn.value]=[.5,.5];localStorage.setItem("ampy.keys",JSON.stringify(keymap));paint()});
  let reset=action("↺ Reset",()=>{keymap={...defaultMap};localStorage.setItem("ampy.keys",JSON.stringify(keymap));paint()});
  row.append(keyIn,add,reset);c.append(row);
  let copy=action("Copy keymap JSON",()=>navigator.clipboard?.writeText(JSON.stringify(keymap,null,2)).then(()=>toast("Copied")).catch(()=>toast("Clipboard unavailable")));copy.style.marginTop="10px";c.append(copy);
  append(c,mk("p","subtle","Mapped keys work while the Remote Phone window is in front and this browser has keyboard focus."));
}
document.addEventListener("keydown",async e=>{
  if(front!=="remote"||document.activeElement?.matches("input,textarea,select"))return;
  if(e.repeat||!keymap[e.code])return;e.preventDefault();
  const p=keymap[e.code];try{await post("/api/tap?x="+p[0]+"&y="+p[1])}catch(err){toast("Keymap unavailable — unlock device")}
});
function renderSettings(c) {
  append(c,mk("h2","","Organic UI Laboratory"),mk("p","subtle","Personalizzazione persistente in questo browser. La modalità finestra/fullscreen del Bridge viene salvata sul Pixel."));
  c.append(mk("div","sectionhead","COLOR PALETTE"));
  const palette=mk("div","row");[["cyberpunk","Cyberpunk"],["vista","Vista Aero"],["futuristic","Futuristic Glass"],["retro","Retro Analog"],["modern","Modern"],["bloodmoon","Blood Moon"]].forEach(([id,label])=>{
    palette.append(action(label,()=>{document.body.dataset.theme=id;localStorage.setItem("ampy.theme",id)}))});c.append(palette);
  c.append(mk("div","sectionhead","AMPYROCKET ANIMATED WALLPAPERS"));
  const bgRow=mk("div","row");[["aurora","Aurora"],["synthwave","Synthwave"],["warp","Warp"],["honeycomb","Hive"],["static","Still"]].forEach(([id,label])=>{
    bgRow.append(action(label,()=>{document.body.dataset.bg=id;localStorage.setItem("ampy.bg",id)}))});c.append(bgRow);
  c.append(mk("div","sectionhead","TRANSLUCENCY / ANIMATION"));
  const reduce=mk("div","row"),check=mk("input");check.type="checkbox";check.style.width="auto";check.checked=document.body.classList.contains("reduce");check.onchange=()=>{document.body.classList.toggle("reduce",check.checked);localStorage.setItem("ampy.reduce",check.checked?"1":"0")};append(reduce,check,mk("span","","Reduced motion (accessibility)"));c.append(reduce);
  const blur=mk("input");blur.type="range";blur.min=0;blur.max=35;blur.value=localStorage.getItem("ampy.blur")||18;blur.oninput=()=>{document.documentElement.style.setProperty("--blur",blur.value+"px");localStorage.setItem("ampy.blur",blur.value)};append(c,mk("p","subtle","Window glass blur"),blur);
  c.append(mk("div","sectionhead","BRIDGE DISPLAY MODE"));
  const mode=mk("select");for(const m of ["windowed","fullscreen"]){const o=mk("option","",m);o.value=m;mode.append(o)}mode.value=state.mode||"windowed";
  mode.onchange=async()=>{try{await post("/api/mode?mode="+mode.value);state.mode=mode.value;toast("Bridge mode saved: "+mode.value)}catch(e){toast(e.message)}};c.append(mode);
  c.append(mk("div","sectionhead","WINDOWS BRIDGE • OPTIONAL PORTABLE EXECUTABLE"));
  append(c,mk("p","subtle","Download the signed-by-workflow self-contained helper on the PC, then run it manually. No installer. Windows will not auto-execute transferred EXEs."));
  c.append(action("⬇ Download AmpyDeskBridge.exe",()=>{let a=mk("a");a.href=api("/bridge.exe");a.download="AmpyDeskBridge.exe";document.body.append(a);a.click();a.remove()}));
  c.append(mk("div","gap"));
  c.append(action("Browser fullscreen",async()=>{try{await document.documentElement.requestFullscreen()}catch(e){toast("Fullscreen rejected by browser")}}));
}
async function renderSystem(c){
  append(c,mk("h2","","Live boot / system diagnostics"));
  let code=mk("textarea");code.readOnly=true;code.rows=15;c.append(code);
  const update=async()=>{try{state=await json("/api/status");code.value=[
    "[AMPY] HELLO DESKTOP", "[SERVICE] "+(state.server?"ACTIVE":"STOPPED"),
    "[DEVICE] "+state.name, "[ANDROID] "+state.android,
    "[NETWORK] "+state.network+":8777",
    "[ACCESSIBILITY] "+(state.accessibility?"ACTIVE":"INACTIVE"),
    "[DEVICE OWNER] "+(state.owner?"PROVISIONED":"NOT PROVISIONED"),
    "[TRANSFER] "+state.transferRoot,
    "[BRIDGE MODE] "+state.mode,
    "[DESKTOP] Browser-based compositor ready",
    "[WARNING] Android lock screen blocks physical remote control",
    "[SECURITY] Keep link secret; LAN transport is HTTP (not encrypted)"
  ].join("\n")}catch(e){code.value="OFFLINE: "+e.message}};
  c.append(action("Refresh real state",update));await update();fillHud();
}
$("#start").onclick=()=>openWindow("apps");
$("#full").onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen().catch(()=>toast("Fullscreen unavailable"))};
function tick(){const now=new Date();$("#clock").textContent=now.toLocaleTimeString("it-IT")}tick();setInterval(tick,1000);
document.body.dataset.theme=localStorage.getItem("ampy.theme")||"cyberpunk";
document.body.dataset.bg=localStorage.getItem("ampy.bg")||"aurora";
document.body.classList.toggle("reduce",localStorage.getItem("ampy.reduce")==="1");
document.documentElement.style.setProperty("--blur",(localStorage.getItem("ampy.blur")||18)+"px");

function fillHud(){
  if(!state||!state.name)return;
  $("#hud-device").textContent=state.name.toUpperCase();
  $("#hud-link").textContent=state.server?"LAN ACTIVE":"OFFLINE";
  $("#hud-owner").textContent=state.owner?"ON":"OPTIONAL";
  $("#hud-remote").textContent=state.accessibility?"ON":"OFF";
}
function renderNotes(c){
  append(c,mk("h2","","AmpyPad / Studio Notebook"),mk("p","subtle","Local browser draft workspace inspired by AmpyPad. Saved in this browser only; it is not synced with the Android AmpyPad app."));
  const bar=mk("div","row"),sel=mk("select");
  [["cyber","Cyber Neon"],["parchment","Parchment"],["blueprint","Blueprint"],["chalk","Blackboard"]].forEach(([id,text])=>{const o=mk("option","",text);o.value=id;sel.append(o)});
  const paper=mk("div","quillArea"),area=mk("textarea");
  paper.dataset.paper=localStorage.getItem("ampy.paper")||"cyber";
  sel.value=paper.dataset.paper;
  sel.onchange=()=>{paper.dataset.paper=sel.value;localStorage.setItem("ampy.paper",sel.value)};
  area.placeholder="✎ Your notes, sketches ideas, project log...";
  area.value=localStorage.getItem("ampy.notebook")||"";
  area.oninput=()=>{localStorage.setItem("ampy.notebook",area.value);count.textContent=area.value.length+" characters • autosaved"};
  const save=action("⬇ Export TXT",()=>{
    const blob=new Blob([area.value],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=mk("a");a.href=url;a.download="AmpyDeskGPT-Notes.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)
  });
  const count=mk("span","subtle",area.value.length+" characters • autosaved");
  append(bar,mk("span","subtle","Paper"),sel,save);
  paper.append(bar,area,count);c.append(paper);
}
function renderLab(c){
  append(c,mk("h2","","AmpyLab // FX Engine"),mk("p","subtle","Transitions inspired by AmpyRocket task cards, AmpyDeck Genie/Glitch and AmpyCam HUD. Effects are visual browser compositor demos."));
  const demo=mk("div","motion-demo");const card=mk("div","card","⬡  MORPH / FLOAT");demo.append(card);c.append(demo);
  c.append(mk("div","sectionhead","VISUAL ENGINE PREVIEW"));
  let row=mk("div","row");
  const effects={
    "Genie":{transform:"translateY(55px) scale(.1,.02) skew(-12deg)",filter:"blur(5px)",opacity:"0"},
    "Glitch":{transform:"translateX(13px) skew(12deg)",filter:"hue-rotate(120deg)",opacity:"0.35"},
    "3D Flip":{transform:"perspective(300px) rotateY(84deg)",filter:"blur(1px)",opacity:"0.2"},
    "Hologram":{transform:"scale(1.28)",filter:"blur(15px)",opacity:"0"},
    "Organic":{transform:"scale(.5) rotate(-7deg)",filter:"hue-rotate(60deg)",opacity:"0"}
  };
  Object.entries(effects).forEach(([name,fx])=>row.append(action(name,()=>{
    card.animate([{transform:"none",filter:"none",opacity:1},fx,{transform:"none",filter:"none",opacity:1}],
    {duration:960,easing:"cubic-bezier(.12,.72,.25,1)"});toast("Preview: "+name)
  })));c.append(row);
  c.append(mk("div","sectionhead","BACKGROUND ENGINE"));
  let info=mk("p","subtle","Wallpaper options: Aurora, synthwave, warp starfield, hex hive, reduced-motion background. Adjust them in Customization.");
  c.append(info,action("Customize interface",()=>openWindow("settings")));
}
